name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test effects pipeline and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :filmfx:test :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FilmPilot.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filmfx-test-report
          path: filmfx/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: FilmPilot-apk
          path: FilmPilot.apk

      - name: Publish "latest" release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest FilmPilot.apk \
            --title "FilmPilot – latest build" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install with: adb install -r FilmPilot.apk" \
            --prerelease --target "$GITHUB_SHA"

  smoke-test:
    name: Emulator smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FilmPilot-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (emulated back camera)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filmpilot-emulator-screenshots
          path: filmpilot-screenshots/
